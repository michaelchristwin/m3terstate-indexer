services:
  m3terstate-indexer:
    image: ghcr.io/michaelchristwin/m3terstate-indexer:${IMAGE_TAG}
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://ponder:${POSTGRES_PASSWORD}@db:5432/m3terstate-index
      DATABASE_SCHEMA: public
      PONDER_RPC_URL_11155111: ${PONDER_RPC_URL_11155111}

    ports:
      - "127.0.0.1:42069:42069"

    networks:
      - public
      - private

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:42069/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: ponder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: m3terstate-index

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - private

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponder -d m3terstate-index"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  public:
  private:
    internal: true

volumes:
  pgdata:
